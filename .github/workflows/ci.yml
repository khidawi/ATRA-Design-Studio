# Runs on every push to main and every pull request, and is reused by the release workflow, so nothing is released that did not pass it.
#
#   tests      the backend (against a real PostgreSQL), the SDK, and a syntax check of the studio page
#   lint       shell scripts, Dockerfiles, the workflows themselves, and the production compose file's configuration
#   security   known vulnerabilities in the Python dependencies, secrets in the code, and misconfiguration in the Dockerfiles and compose files
#   images     both images are built, and scanned for known vulnerabilities in the operating system and the libraries they contain
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stai
          POSTGRES_PASSWORD: stai
          POSTGRES_DB: stai_test          # a name ending in _test: the suites delete data and refuse to run on anything else
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stai -d stai_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://stai:stai@localhost:5432/stai_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the backend's dependencies
        run: pip install -r backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: |
          failed=0
          for f in tests/test_*.py; do
            t=$(basename "$f" .py)
            if python -m "tests.$t" > "/tmp/$t.log" 2>&1; then
              echo "ok      $t ($(grep -c '^PASS' "/tmp/$t.log") checks)"
            else
              echo "FAILED  $t"; grep -E '^FAIL|Traceback|Error' "/tmp/$t.log" | head -20; failed=1
            fi
          done
          exit $failed
      - name: SDK tests
        working-directory: sdk/python
        run: python -m unittest discover -s tests
      - name: Studio page parses
        run: python .github/scripts/check_studio_js.py studio/index.html

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning deploy/*.sh deploy/db/*.sh
      - name: Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          config: .hadolint.yaml
      - name: Dockerfile (studio)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: studio/Dockerfile
          config: .hadolint.yaml
      - name: The workflows themselves
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: The production compose files are valid
        working-directory: deploy
        env:
          POSTGRES_PASSWORD: x
          ASTRA_DB_OWNER_PASSWORD: x
          ASTRA_DB_APP_PASSWORD: x
          ASTRA_SECRET_KEY: x
          ASTRA_DOMAIN: astra.example.org
        run: |
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml -f docker-compose.mtls.yml config --quiet
          docker compose -f docker-compose.demo.yml config --quiet
      - name: The Caddyfile is valid
        working-directory: deploy
        run: |
          for tls in acme internal; do
            docker run --rm -e ASTRA_DOMAIN=astra.example.org -e ASTRA_TLS=$tls -e ASTRA_MTLS=off \
              -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          done

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Known vulnerabilities in the Python dependencies
        run: |
          pip install pip-audit
          pip-audit --strict -r backend/requirements.txt
      - name: Secrets, and misconfiguration in the Dockerfiles and compose files
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: .venv,node_modules,mockups,docs,frontend      # frontend/ is the earlier prototype: it is not built or shipped

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [backend, studio]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          load: true
          push: false
          tags: astra-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan ${{ matrix.image }} for known vulnerabilities (fixable, high or critical)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: astra-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
      - name: The image runs as an unprivileged user
        run: |
          user=$(docker run --rm --entrypoint id astra-${{ matrix.image }}:ci -u)
          echo "uid: $user"
          [ "$user" != "0" ]
