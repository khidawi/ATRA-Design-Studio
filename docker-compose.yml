services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Everything that has to survive a restart lives here (organisation now;
  # regulations, rules, designs and contracts in the next tasks). The data is in
  # the pg_data volume: `docker compose down` keeps it, `down -v` deletes it.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stai}
      POSTGRES_DB: stai
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stai -d stai"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8765:8765"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1
      OLLAMA_TIMEOUT_SECONDS: "280"
      DATABASE_URL: postgresql+psycopg://stai:${POSTGRES_PASSWORD:-stai}@db:5432/stai
      # Encrypts the repository access tokens and webhook secrets kept in the database. Generate one with:
      #   docker compose run --rm backend python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Several keys may be listed, comma separated, to rotate (the first encrypts, all decrypt). Keep it with your backups: without it stored tokens cannot be read.
      ASTRA_SECRET_KEY: ${ASTRA_SECRET_KEY:-}
      # Set to 1 to allow a repository on a private address (a self-hosted GitLab inside the company network).
      ASTRA_REPO_ALLOW_PRIVATE_HOSTS: ${ASTRA_REPO_ALLOW_PRIVATE_HOSTS:-0}
    depends_on:
      ollama:
        condition: service_started
      db:
        condition: service_healthy

  studio:
    build: ./studio
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  ollama_data:
  pg_data:
