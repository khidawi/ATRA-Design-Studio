# Who may connect to the database, and how. The first line that matches wins.
#
# Every connection over the network must use TLS and a password stored as a scram-sha-256 hash; a connection that does not use TLS is refused outright (the reject lines),
# not retried without encryption. The unix socket inside the container is for the health check and for backups run with docker exec; it also needs a password.
local   all   all                 scram-sha-256
hostssl all   all   0.0.0.0/0     scram-sha-256
hostssl all   all   ::/0          scram-sha-256
hostnossl all all   0.0.0.0/0     reject
hostnossl all all   ::/0          reject
