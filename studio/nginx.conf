server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; resolving lazily means nginx starts even if the backend is still booting.
    resolver 127.0.0.11 valid=10s;

    # Same-origin proxy to the FastAPI backend, so the page needs no CORS or hard-coded backend URL.
    # /chat can wait on a local Ollama model, hence the long timeouts.
    location ~ ^/(api|chat|score|health|catalogue|docs|openapi\.json)(/|$) {
        set $backend http://backend:8765;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
