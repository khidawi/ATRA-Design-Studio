<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTRA · Agent assurance prototype</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F6F8;color:#141A22;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
a{color:#1E4FCB}a:hover{color:#163C9C}
button,select,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid #1E4FCB;outline-offset:2px}
.shell{display:flex;min-height:100vh}
nav.side{width:232px;flex:0 0 232px;min-height:100vh;padding:24px 16px;background:#141A22;color:#E7EAEE;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 8px}
.brand b{font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.14em;color:#fff}
.brand span,.tenant small,.who small{font-size:12px;color:#A9B1BC}
.tenant{padding:10px 12px;border:1px solid #2D3642;border-radius:8px;display:flex;flex-direction:column;gap:2px}
.tenant strong{font-size:13px;color:#fff}
button.tenant{background:transparent;color:inherit;font:inherit;text-align:left;width:100%;cursor:pointer}
button.tenant:hover{border-color:#4A5563}
.navlinks{display:flex;flex-direction:column;gap:4px}
.navlinks a{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;color:#C9CFD7;font-size:14px;font-weight:500;text-decoration:none}
.navlinks a:hover{background:#1F2833;color:#fff}
.navlinks a.on{background:#2A3442;color:#fff;font-weight:600}
.navlinks a small{font-size:12px;color:#A9B1BC}
.who{margin-top:auto;padding:0 8px;display:flex;flex-direction:column;gap:4px}
.who span{font-size:13px}
main{flex:1 1 auto;min-width:0;padding:32px 40px 48px;display:flex;flex-direction:column;gap:24px;max-width:1280px}
h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.01em}
h2{margin:0;font-size:16px;font-weight:600}
h3{margin:0;font-size:18px;font-weight:600}
.cap{font-size:13px;color:#4A5563}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.card{background:#fff;border:1px solid #DDE1E7;border-radius:10px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.ok{background:#E3EBFB;color:#153C99}.warn{background:#FBE9D3;color:#7F3905}.bad{background:#F9DEDB;color:#8C1F17}.muted{background:#ECEFF2;color:#38414D}
.btn,.btn2,.btn3{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:8px;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn{border:1px solid #1E4FCB;background:#1E4FCB;color:#fff;font-weight:600}
.btn:hover{background:#163C9C;color:#fff}
.btn:disabled{background:#AEB7C4;border-color:#AEB7C4;cursor:not-allowed}
.btn2{border:1px solid #C5CCD6;background:#fff;color:#141A22;font-weight:500}
.btn2:hover{border-color:#1E4FCB;color:#141A22}
.btn3{border:1px solid #8C1F17;background:#fff;color:#8C1F17;font-weight:500}
.btn-s{min-height:36px;padding:0 12px;font-size:13px}
.btn-on{border-color:#1E4FCB;background:#E3EBFB;color:#153C99}
.seg{display:flex;gap:6px;padding:4px;background:#ECEFF2;border-radius:10px;flex-wrap:wrap}
.tab{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid transparent;background:transparent;color:#38414D;font-size:14px;font-weight:500;cursor:pointer}
.tab.on{background:#fff;border-color:#C5CCD6;color:#141A22}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hdr>div:first-child{display:flex;flex-direction:column;gap:6px}
.back{font-size:13px;color:#1E4FCB;text-decoration:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi{padding:20px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:#141A22}
.kpi:hover{border-color:#1E4FCB;color:#141A22}
.kpi big{font-size:32px;font-weight:600}
.kpi big small{font-size:16px;font-weight:500;color:#4A5563}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px;align-items:start}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-top:1px solid #EDF0F3;text-decoration:none;color:#141A22;flex-wrap:wrap}
a.lrow:hover{background:#F8F9FB;color:#141A22}
.stack{display:flex;flex-direction:column;gap:4px}
.ph{padding:16px 20px 12px}
.act{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;padding:12px 20px;border-top:1px solid #EDF0F3}
.tbl{overflow-x:auto}
.grow{display:grid;grid-template-columns:1.4fr 1.2fr 1.3fr .5fr 1.2fr .9fr 1.4fr 1.1fr;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid #EDF0F3;min-width:980px}
.grow.head{font-size:12px;font-weight:500;color:#4A5563;border-bottom:1px solid #DDE1E7}
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 20px;border-top:1px solid #EDF0F3}
.map{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 20px;border-top:1px solid #EDF0F3}
.box{padding:12px 14px;border:1px solid #DDE1E7;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.note{padding:14px;border-radius:8px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.note.good{background:#E3EBFB;color:#153C99}.note.alert{background:#F9DEDB;color:#8C1F17}.note.plain{background:#F5F6F8;color:#141A22}
pre.code{margin:0;padding:16px;background:#141A22;color:#E7EAEE;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.6;overflow-x:auto}
.item{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:14px 16px;border:1px solid #DDE1E7;border-radius:10px;background:#fff;color:#141A22;font-size:14px;cursor:pointer}
.item.on{border-color:#1E4FCB;box-shadow:0 0 0 1px #1E4FCB}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid #EDF0F3}
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.split>.l{flex:1 1 280px;display:flex;flex-direction:column;gap:12px}
.split>.r{flex:2 1 520px;min-width:0}
.crow{display:grid;grid-template-columns:70px minmax(0,1.8fr) 100px 80px 90px minmax(0,1fr);gap:12px;align-items:center;width:100%;min-height:52px;padding:8px 20px;border:0;border-bottom:1px solid #EDF0F3;background:#fff;color:#141A22;font-size:14px;text-align:left;cursor:pointer;min-width:660px}
.crow:hover{background:#F8F9FB}.crow.on{background:#EEF3FD}
.crow.head{font-size:12px;font-weight:500;color:#4A5563;cursor:default;min-height:40px;border-bottom:1px solid #DDE1E7}
.opt{display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px;border:1px solid #DDE1E7;border-radius:10px;background:#fff;color:#141A22;font-size:14px;cursor:pointer}
.opt.on{border-color:#1E4FCB;box-shadow:0 0 0 1px #1E4FCB}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:#1E4FCB}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:500}
.inp{min-height:44px;padding:0 12px;border:1px solid #C5CCD6;border-radius:8px;background:#fff;font-size:14px;color:#141A22}
.choice{display:flex;flex-direction:column;gap:14px;padding:28px;border:1px solid #DDE1E7;border-radius:12px;background:#fff;color:#141A22;text-decoration:none}
.choice:hover{border-color:#1E4FCB;box-shadow:0 0 0 1px #1E4FCB;color:#141A22}
.step{display:flex;gap:10px;line-height:1.5}
.num{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:999px;background:#ECEFF2;font-size:12px;font-weight:600;color:#38414D}
.num.on{background:#1E4FCB;color:#fff}.num.done{background:#E3EBFB;color:#153C99}
.steps{display:flex;gap:24px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:10px;color:#4A5563}
.chg{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #EDF0F3}
.sym{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-weight:600}
.sym.add{background:#E3EBFB;color:#153C99}.sym.del{background:#FBE9D3;color:#7F3905}.sym.mod{background:#ECEFF2;color:#38414D}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #C5CCD6;background:#fff;color:#141A22;font-size:13px;font-weight:500;cursor:pointer}
.chip:hover{border-color:#1E4FCB}
.canvas{position:relative;width:640px}
.edge{position:absolute;height:0;border-top:1.5px solid #AEB7C4;transform-origin:0 0}
.elabel{position:absolute;transform:translate(-50%,-50%);padding:1px 6px;border-radius:4px;background:#F5F6F8;color:#4A5563;font:500 10px 'IBM Plex Mono',monospace;white-space:nowrap}
.node{position:absolute;width:168px;height:52px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 12px;border:1px solid #C5CCD6;border-radius:8px;background:#fff;color:#141A22;text-align:left;cursor:pointer}
.node:hover{border-color:#1E4FCB}
.node.agent{border:2px solid #1E4FCB;background:#F2F6FE}
.node.goal{border-style:dashed}
.node.sel{box-shadow:0 0 0 3px rgba(30,79,203,.35)}
.node .tag{font-size:10px;font-weight:600;letter-spacing:.04em;color:#4A5563}
.node .nm{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:-9px;right:8px;padding:1px 7px;border-radius:999px;background:#8C1F17;color:#fff;font:600 10px 'IBM Plex Mono',monospace}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #EDF0F3}
.demo{font-size:12px;color:#A9B1BC;padding:0 8px}
.prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.prow .inp{min-height:38px;max-width:260px}
.rcr{padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.rcr-eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#38414D}
.rcr-score{font-size:48px;font-weight:600;line-height:1;letter-spacing:-.02em}
.band{display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.band.clear{background:#E2F3E9;color:#14532D}.band.watch{background:#FBE9D3;color:#7F3905}.band.incident{background:#F9DEDB;color:#8C1F17}
.gate{min-width:96px;padding:10px 14px;border-radius:8px;border:2px solid;text-align:center;display:flex;flex-direction:column;gap:2px}
.gate small{font-size:11px;font-weight:600;letter-spacing:.06em}
.gate b{font-size:20px;letter-spacing:.02em}
.gate.clear{border-color:#1E7F4F;color:#14532D;background:#F1FAF4}.gate.watch{border-color:#B45309;color:#7F3905;background:#FEF6EC}.gate.incident{border-color:#B42318;color:#8C1F17;background:#FDF0EE}
.rcr-parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rcr-part{padding:14px 16px;border:1px solid #DDE1E7;border-radius:10px;display:flex;flex-direction:column;gap:8px}
.rcr-part.binding{border:2px solid #B42318;background:#FDF0EE}
.rcr-part .lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#4A5563}
.meter{height:6px;border-radius:999px;background:#ECEFF2;overflow:hidden}
.meter span{display:block;height:100%;border-radius:999px;background:#6B7686}
.rcr-part.binding .meter span{background:#B42318}
.bandbar{position:relative;height:8px;border-radius:999px;display:flex}
.bandbar i:first-child{border-radius:999px 0 0 999px}.bandbar i:nth-child(3){border-radius:0 999px 999px 0}
.bandbar i{display:block;height:100%}
.bandmark{position:absolute;top:-6px;width:3px;height:20px;background:#141A22;box-shadow:0 0 0 2px #fff;border-radius:2px}
.bandscale{display:flex;justify-content:space-between;font-size:11px;color:#4A5563}
.binding-tag{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:4px;background:#B42318;color:#fff}
.reqrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #EDF0F3}
.reqsel{min-height:36px;padding:0 8px;border:1px solid #C5CCD6;border-radius:8px;background:#fff;font-size:13px}
.studiocols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:1200px){.studiocols{grid-template-columns:minmax(0,1fr)}}

/* ---------- Landing ---------- */
.landing{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:#F5F6F8}
.landing-in{width:min(960px,100%);display:flex;flex-direction:column;gap:14px}
.landing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin:8px 0 6px}
.landing-card{min-height:260px}
/* ---------- Model module ---------- */
main.wide{max-width:none}
.m-name{font:600 26px 'IBM Plex Sans',system-ui,sans-serif;letter-spacing:-.01em;color:#141A22;border:1px solid transparent;border-radius:8px;padding:2px 6px;margin-left:-7px;background:transparent;width:min(560px,100%)}
.m-name:hover{border-color:#DDE1E7}.m-name:focus{border-color:#1E4FCB;background:#fff}
.m-badge{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid #DDE1E7;border-radius:10px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:#141A22}
.m-badge:hover{border-color:#1E4FCB}
.m-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m-body{display:grid;grid-template-columns:184px minmax(0,1fr) 344px;gap:16px;height:calc(100vh - 230px);min-height:560px}
.m-palette{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.m-pal-group{display:flex;flex-direction:column;gap:4px}
.m-pal-h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#4A5563;padding:2px 4px}
.m-pal{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:34px;padding:5px 8px;border:1px solid transparent;border-radius:8px;background:transparent;color:#141A22;font-size:13px;font-weight:500;text-align:left;cursor:pointer}
.m-pal:hover{background:#F2F4F7;border-color:#DDE1E7}
.m-bundle{border-color:#DDE1E7;background:#FAFBFC}.m-bundle small{font:500 10.5px 'IBM Plex Mono',monospace;color:#4A5563}
.m-canvas{position:relative;overflow:auto;border:1px solid #DDE1E7;border-radius:10px;background:#FBFCFD radial-gradient(#DDE1E7 1px,transparent 1px) 0 0/20px 20px}
.m-sizer{position:relative}.m-plane{position:relative;transform-origin:0 0}
.m-zoom{display:inline-flex;align-items:center;gap:6px;margin-left:8px}.m-zoom .mono{min-width:42px;text-align:center;font-size:13px}
.m-edges{position:absolute;left:0;top:0;pointer-events:none}
.m-edge line{stroke:#8A94A3;stroke-width:1.5}
.m-edge line.hit{stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.m-edge text{font:500 10px 'IBM Plex Mono',monospace;fill:#4A5563;pointer-events:all;cursor:pointer;paint-order:stroke;stroke:#FBFCFD;stroke-width:4px}
.m-edge.on line:not(.hit){stroke:#1E4FCB;stroke-width:2.5}.m-edge.on text{fill:#1E4FCB}
.m-temp{stroke:#1E4FCB;stroke-width:2;stroke-dasharray:6 4}
.m-node{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:6px 14px 6px 12px;background:#fff;border:1px solid #C5CCD6;border-radius:8px;cursor:grab;user-select:none;touch-action:none;box-sizing:border-box}
.m-node:hover{border-color:#1E4FCB}.m-node:active{cursor:grabbing}
.m-node.dept{justify-content:flex-start;padding:8px;background:rgba(236,239,242,.6);border:1.5px dashed #AEB7C4}
.m-node.sel{box-shadow:0 0 0 3px rgba(30,79,203,.35);border-color:#1E4FCB}
.m-node.risk-red{border:2px solid #B42318}.m-node.risk-amber{border:2px solid #D97706}.m-node.risk-green{border:2px solid #1E7F4F}
.m-kind{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.m-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-sub{font-size:11.5px;color:#4A5563;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-dept-pill{align-self:flex-start;padding:2px 8px;border-radius:6px;background:#fff;border:1px solid #DDE1E7;font-size:12px;font-weight:600}
.m-handle{position:absolute;right:-7px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:999px;background:#fff;border:2px solid #1E4FCB;cursor:crosshair}
.m-node.dept .m-handle{top:18px}
.m-resize{position:absolute;right:3px;bottom:3px;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,#AEB7C4 50%,#AEB7C4 60%,transparent 60%,transparent 75%,#AEB7C4 75%,#AEB7C4 85%,transparent 85%)}
.m-side{overflow:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px}
.m-side .tab{flex:1 1 auto;padding:0 8px;font-size:13px}
.m-terms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.m-terms span{display:flex;flex-direction:column;padding:6px 8px;border:1px solid #EDF0F3;border-radius:6px}
.m-terms small{font-size:11px;color:#4A5563}.m-terms sub,.m-side sub{font-size:.75em;line-height:0}.m-terms b{font-size:13px}
.m-pillar{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px}.m-pillar b{text-align:right}
.m-empty{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(420px,90%);padding:20px;border-radius:12px;background:#fff;border:1px solid #DDE1E7;display:flex;flex-direction:column;gap:8px;text-align:center;align-items:center;box-shadow:0 8px 24px rgba(20,26,34,.08)}
.m-empty span{font-size:13px;color:#4A5563}
.m-drawer{position:fixed;right:0;top:0;bottom:0;width:min(480px,100%);background:#fff;border-left:1px solid #DDE1E7;box-shadow:-12px 0 32px rgba(20,26,34,.12);padding:20px;overflow:auto;z-index:50;display:flex;flex-direction:column;gap:12px}
.m-chatlog{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto;padding:4px}
.m-msg{padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.45;max-width:92%}
.m-msg.user{align-self:flex-end;background:#1E4FCB;color:#fff}.m-msg.bot{align-self:flex-start;background:#F2F4F7}.m-msg.err{background:#F9DEDB;color:#8C1F17}
@media (max-width:1180px){.m-body{grid-template-columns:minmax(0,1fr);height:auto}.m-palette{flex-direction:row;flex-wrap:wrap;max-height:none}.m-pal-group{flex:1 1 200px}.m-canvas{height:560px}.m-side{max-height:none}}

@media (max-width:820px){.m-pal-group{flex-direction:row;flex-wrap:wrap;gap:6px}.m-pal-h{flex-basis:100%}.m-pal{width:auto;border-color:#DDE1E7;background:#fff}.m-bundle{flex:1 1 100%}.m-name{font-size:21px}.m-canvas{height:440px}}
@media (max-width:820px){
 .shell{flex-direction:column}
 nav.side{width:100%;flex:none;min-height:0;height:auto;position:static;padding:16px}
 .navlinks{flex-direction:row;overflow-x:auto}
 .navlinks a{flex:0 0 auto;gap:8px}
 .who,.tenant{display:none}
 main{padding:24px 16px 40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{nav.side,.noprint{display:none !important}main{max-width:none !important;padding:0 !important}.shell{display:block !important}body{background:#fff !important}}
.navbtn{background:none;border:1px solid #3A4553;color:#C9D1DA;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;text-decoration:none}.navbtn:hover{background:#232C38}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Thin client for the ST-AI Design Studio backend (FastAPI). The scoring and
   compliance engines run server-side only: nothing here computes a score,
   an assessment or a contract hash. */
(function (root) {
  'use strict';
  const BASE = (root.ASTRA_API_BASE || '').replace(/\/$/, '');

  function errText(detail, fallback) {
    if (detail === null || detail === undefined) return fallback || 'Request failed';
    if (typeof detail === 'string') return detail;
    if (Array.isArray(detail)) {
      return detail.map((d) => {
        if (typeof d === 'string') return d;
        const loc = (d.loc || []).filter((x) => x !== 'body').join('.');
        return (loc ? loc + ': ' : '') + (d.msg || JSON.stringify(d));
      }).join('\n');
    }
    return JSON.stringify(detail);
  }
  async function call(path, opts) {
    let res;
    try {
      res = await fetch(BASE + path, Object.assign({ credentials: 'same-origin' }, opts, { headers: Object.assign({ 'Content-Type': 'application/json', 'X-ASTRA-CSRF': '1' }, (opts && opts.headers) || {}) }));
    } catch (e) {
      const err = new Error('Cannot reach the ST-AI backend. Is it running?');
      err.network = true;
      throw err;
    }
    let body = null;
    try { body = await res.json(); } catch (e) { /* non-JSON body */ }
    if (res.status === 401 && !path.startsWith('/api/auth/') && STAI.onUnauthorized) STAI.onUnauthorized();
    if (!res.ok) {
      const err = new Error(errText(body && body.detail !== undefined ? body.detail : body, res.status + ' ' + res.statusText));
      err.status = res.status;
      throw err;
    }
    return body;
  }
  const post = (path, body) => call(path, { method: 'POST', body: JSON.stringify(body) });
  const designPath = (id, action) => '/api/designs/' + encodeURIComponent(id) + '/' + action;

  const STAI = {
    // Filled from GET /catalogue/constraints and GET /api/domains at start-up.
    VETO: [], MODULATING: [], CONSTRAINTS: {}, DOMAINS: {},
    // Option lists for the inspector; these mirror the backend's Literal types (backend/chat.py).
    ENUMS: {
      ai_criticality: ['ADVISORY', 'OPERATIONAL', 'CRITICAL', 'SAFETY_CRITICAL'],
      data_sensitivity: ['PUBLIC', 'INTERNAL', 'CONFIDENTIAL', 'SENSITIVE_PERSONAL', 'SPECIAL_CATEGORY'],
      system_type: ['TYPE_1_INHOUSE', 'TYPE_2_FINETUNED', 'TYPE_3_THIRDPARTY_API']
    },
    pyFixed: (x, n) => (x === null || x === undefined || !isFinite(x)) ? '\u2014' : Number(x).toFixed(n),
    pyFloat: (x) => (x === null || x === undefined) ? '\u2014' : (Number.isInteger(x) ? x.toFixed(1) : String(x)),
    api: {
      loadCatalogue: async () => {
        const [cat, doms] = await Promise.all([call('/catalogue/constraints'), call('/api/domains')]);
        STAI.VETO = cat.filter((c) => c.class === 'veto').map((c) => c.constraint_id);
        STAI.MODULATING = cat.filter((c) => c.class !== 'veto').map((c) => c.constraint_id);
        STAI.CONSTRAINTS = {};
        cat.forEach((c) => { STAI.CONSTRAINTS[c.constraint_id] = { name: c.name, refs: c.standard_refs || [] }; });
        STAI.DOMAINS = {};
        doms.forEach((d) => { STAI.DOMAINS[d.domain_id] = d; });
      },
      score: (registry) => post('/score', { registry }),
      assess: (designId, domain, registry, constraintNodeIds, designGraph) => post(designPath(designId, 'assess'), { domain, registry, constraint_node_ids: constraintNodeIds, design_graph: designGraph }),
      compile: (designId, body) => post(designPath(designId, 'compile'), body),
      importDescription: (description) => post('/api/designs/import', description),
      chat: (message, history) => post('/chat', { message, history }),
      draftAgent: (description) => post('/api/agents/draft', { description }),
      analyseAgent: (graph) => post('/api/agents/analyse', { graph }),
      listDesigns: () => call('/api/designs?subject=MODEL'),
      getDesign: (key) => call('/api/designs/' + encodeURIComponent(key)),
      createDesign: (body) => post('/api/designs', body),
      saveDesign: (key, body) => call('/api/designs/' + encodeURIComponent(key), { method: 'PUT', body: JSON.stringify(body) }),
      deleteDesign: (key) => call('/api/designs/' + encodeURIComponent(key), { method: 'DELETE' }),
      listContracts: () => call('/api/contracts?object_type=MODEL'),
      listContractRecords: (type) => call('/api/contract-records?object_type=' + type),
      revokeContract: (id, body) => post('/api/contracts/' + encodeURIComponent(id) + '/revoke', body),
      importContract: (c, design) => post('/api/contracts/import' + (design ? '?design=' + encodeURIComponent(design) : ''), c),
      verifyContract: (id) => call('/api/contracts/' + encodeURIComponent(id) + '/verify'),
      listDrift: () => call('/api/drift'),
      driftScenarios: () => call('/api/drift/scenarios'),
      proposeDrift: (design_key) => post('/api/drift/propose', { design_key }),
      simulateDrift: (body) => post('/api/drift/simulate', body),
      decideDrift: (id, body) => post('/api/drift/' + encodeURIComponent(id) + '/decide', body),
      listFindings: () => call('/api/findings'),
      findingScenarios: () => call('/api/findings/scenarios'),
      simulateFinding: (body) => post('/api/findings/simulate', body),
      ackFinding: (key, body) => post('/api/findings/' + encodeURIComponent(key) + '/acknowledge', body),
      draftFindingTest: (key) => post('/api/findings/' + encodeURIComponent(key) + '/test', {}),
      haltFinding: (key) => post('/api/findings/' + encodeURIComponent(key) + '/halt', {}),
      getCoverage: () => call('/api/coverage'),
      assignCoverage: (code, body) => call('/api/coverage/' + encodeURIComponent(code), { method: 'PUT', body: JSON.stringify(body) }),
      listPacks: () => call('/api/packs'),
      getPack: (key) => call('/api/packs/' + encodeURIComponent(key)),
      generatePack: (body) => post('/api/packs', body),
      verifyPack: (key) => call('/api/packs/' + encodeURIComponent(key) + '/verify'),
      getOverview: () => call('/api/overview'),
      getWorkspace: () => call('/api/workspace'),
      authStatus: () => call('/api/auth/status'),
      authMe: () => call('/api/auth/me'),
      login: (email, password) => post('/api/auth/login', { email, password }),
      bootstrap: (email, full_name, password) => post('/api/auth/bootstrap', { email, full_name, password }),
      logout: () => call('/api/auth/logout', { method: 'POST' }),
      changePassword: (current_password, new_password) => post('/api/auth/change-password', { current_password, new_password }),
      listUsers: () => call('/api/users'),
      createUser: (body) => post('/api/users', body),
      updateUser: (id, body) => call('/api/users/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify(body) }),
      resetPassword: (id, password) => post('/api/users/' + encodeURIComponent(id) + '/reset-password', { password }),
      listAudit: (before) => call('/api/audit?limit=100' + (before ? '&before=' + before : '')),
      verifyAudit: () => call('/api/audit/verify'),
      download: async (path, fallback) => {
        let res;
        try { res = await fetch(BASE + path, { credentials: 'same-origin' }); } catch (e) { const err = new Error('Cannot reach the ST-AI backend. Is it running?'); err.network = true; throw err; }
        if (res.status === 401 && STAI.onUnauthorized) STAI.onUnauthorized();
        if (!res.ok) { let body = null; try { body = await res.json(); } catch (e) { /* not JSON */ } throw new Error(errText(body && body.detail !== undefined ? body.detail : body, res.status + ' ' + res.statusText)); }
        const m = /filename="([^"]+)"/.exec(res.headers.get('Content-Disposition') || '');
        return { blob: await res.blob(), name: m ? m[1] : fallback };
      },
      listAgents: () => call('/api/agents'),
      registerAgent: (body) => post('/api/agents/register', body),
      setAgentOwner: (key, owner) => call('/api/agents/' + encodeURIComponent(key), { method: 'PATCH', body: JSON.stringify({ owner }) }),
      ratifyAgent: (body) => post('/api/agents/ratify', body),
      loadDemoAgents: () => post('/api/agents/demo', {}),
      removeDemoAgents: () => call('/api/agents/demo', { method: 'DELETE' }),
      listAgentDesigns: () => call('/api/designs?subject=AGENT'),
      listRegulations: () => call('/api/regulations'),
      startIngestion: (body) => post('/api/ingestion/runs', body),
      getIngestionRun: (id) => call('/api/ingestion/runs/' + id),
      listIngestionRuns: () => call('/api/ingestion/runs?limit=5'),
      listCandidates: (status) => call('/api/ingestion/candidates' + (status ? '?status=' + status : '')),
      approveCandidate: (id, body) => post('/api/ingestion/candidates/' + id + '/approve', body),
      rejectCandidate: (id, note) => post('/api/ingestion/candidates/' + id + '/reject', { note }),
      rcrProfiles: () => call('/api/rcr/profiles'),
      rcrScore: (body) => post('/api/rcr/score', body),
      getOrganisation: () => call('/api/organisation'),
      listDomains: (subject) => call('/api/domains?subject=' + encodeURIComponent(subject)),
      policyVocabulary: () => call('/api/policies/vocabulary'),
      listPolicies: () => call('/api/policies'),
      savePolicy: (key, body) => (key ? call('/api/policies/' + encodeURIComponent(key), { method: 'PUT', body: JSON.stringify(body) }) : post('/api/policies', body)),
      setPolicyStatus: (key, status) => call('/api/policies/' + encodeURIComponent(key), { method: 'PATCH', body: JSON.stringify({ status }) }),
      deletePolicy: (key) => call('/api/policies/' + encodeURIComponent(key), { method: 'DELETE' }),
      testPolicy: (body) => post('/api/policies/test', body),
      renameOrganisation: (name) => call('/api/organisation', { method: 'PATCH', body: JSON.stringify({ name }) })
    }
  };
  root.STAI = STAI;
})(window);
</script>
<script>
(function () {
  'use strict';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const opt = (v, l, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`;

  const ORG = { name: 'Organisation' }; // loaded from GET /api/organisation
  const S = {
    agents: { tab: 'all', asked: false },
    contract: { acc: {}, approved: false, mode: 'dual' },
    findings: { filter: 'all', sel: null },
    coverage: { sel: null },
    workspace: { role: 'comp' },
    add: { step: 1, src: 'code', confirmed: false, name: '', owner: '', framework: '', tools: '0', error: null, busy: false },
    studio: { drafted: false, nodes: [], edges: [], sel: null, panel: 'analysis', policy: 'block', ratified: false, n: 100, domain: 'payments', req: {}, designKey: null, version: 0, saveState: 'saved', saveError: null, savedSig: '', ratifyError: null, ratifyInfo: null },
    drift: { sel: null }
  };

  const NAV = [['overview', 'Overview', ''], ['agents', 'Agents', '12'], ['studio', 'Design studio', ''], ['drift', 'Drift review', '3'], ['findings', 'Findings', '4'], ['coverage', 'Coverage', '7/10'], ['packs', 'Trust and packs', ''], ['workspace', 'Compliance workspace', '2'], ['policies', 'Policies', ''], ['regulations', 'Regulations', '']];
  const PARENT = { newagent: 'agents', addagent: 'agents', contract: 'agents', pack: 'packs' };

  function nav(active) {
    return `<nav class="side" aria-label="Main">
      <a class="brand" href="#/" style="text-decoration:none" title="Switch module"><b>ASTRA</b><span>Agent assurance</span></a>
      <button type="button" class="tenant" data-act="orgRename" title="Rename organisation"><strong>${esc(ORG.name)}</strong><small>Organisation · click to rename</small></button>
      <div class="navlinks">${NAV.map(([k, l, b]) => (k === 'agents' ? [k, l, AG.loaded && AG.list.length ? String(AG.list.length) : ''] : (k === 'drift' ? [k, l, FD.loaded ? String(FD.drift.filter((x) => x.status === 'OPEN').length || '') : ''] : (k === 'findings' ? [k, l, FD.loaded ? String(FD.findings.filter((x) => x.status === 'OPEN').length || '') : ''] : (k === 'coverage' ? [k, l, CV.loaded && CV.data.agents_in_scope ? CV.data.covered + '/' + (CV.data.covered + CV.data.partial + CV.data.gap + CV.data.no_data) : ''] : (k === 'workspace' ? [k, l, FD.loaded ? String(FD.drift.filter((x) => x.status === 'OPEN' && x.source !== 'DEMO').length || '') : ''] : [k, l, b])))))).map(([k, l, b]) => `<a href="#/${k}"${k === active ? ' class="on" aria-current="page"' : ''}><span>${l}</span><small>${b}</small></a>`).join('')}<a href="#/"><span>Switch module</span><small>\u21c4</small></a></div>
      ${whoBox()}
      ${AG.list.some((a) => a.origin === 'DEMO') ? '<div class="demo">Demo agents loaded</div>' : ''}
    </nav>`;
  }
  const hdr = (eyebrow, title, right, back) => `<header class="hdr"><div>${back ? `<a class="back" href="#/${back[0]}">← ${back[1]}</a>` : ''}${eyebrow ? `<span class="cap">${eyebrow}</span>` : ''}<h1>${title}</h1></div>${right ? `<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">${right}</div>` : ''}</header>`;
  const segTabs = (items, cur, act) => `<div class="seg" role="tablist">${items.map(([k, l]) => `<button class="tab${k === cur ? ' on' : ''}" role="tab" aria-selected="${k === cur}" data-act="${act}" data-arg="${k}">${l}</button>`).join('')}</div>`;

  /* ---------- Sign-in, users and the audit log (Task 8) ---------- */
  let ME = null, PERMS = [];
  const can = (p) => PERMS.includes(p);
  const AUTH = { checked: false, needsBootstrap: false };
  const ROLE_LABEL = { admin: 'Administrator', compliance: 'Compliance', engineer: 'Engineer', auditor: 'Auditor' };
  const ROLE_HELP = { admin: 'Everything, including users', compliance: 'Design and sign off', engineer: 'Design and propose; cannot sign off', auditor: 'Read-only, and the audit log' };
  function authScreen() {
    const brand = '<div class="brand" style="padding:0"><b style="color:#141A22;font-size:26px">ASTRA</b><span style="color:#4A5563;font-size:14px">Assurance for AI agents and AI models</span></div>';
    if (!AUTH.checked) return `<div class="landing"><div class="landing-in">${brand}<p class="cap">Loading\u2026</p></div></div>`;
    const boot = AUTH.needsBootstrap;
    return `<div class="landing"><div class="landing-in" style="max-width:440px">${brand}<h1 style="font-size:26px;margin-top:8px">${boot ? 'Create the first administrator' : 'Sign in'}</h1>
      <p class="cap" style="margin:0">${boot ? 'No one has an account yet. This person can add everyone else. Choose a long password (at least 10 characters); it cannot be recovered by email.' : 'Use the account an administrator created for you.'}</p>
      <form id="auth-form" style="display:flex;flex-direction:column;gap:12px;margin-top:8px">${boot ? '<div class="fld"><label for="a-name">Full name</label><input id="a-name" class="inp" name="name" autocomplete="name" required></div>' : ''}
      <div class="fld"><label for="a-email">Email</label><input id="a-email" class="inp" type="email" name="email" autocomplete="username" required></div>
      <div class="fld"><label for="a-pw">Password</label><input id="a-pw" class="inp" type="password" name="password" autocomplete="${boot ? 'new-password' : 'current-password'}" required${boot ? ' minlength="10"' : ''}></div>
      <div id="auth-error" class="note alert" role="alert" style="display:none"></div>
      <button class="btn" type="submit">${boot ? 'Create administrator' : 'Sign in'}</button></form></div></div>`;
  }
  document.addEventListener('submit', async (e) => {
    const f = e.target.closest('#auth-form'), uf = e.target.closest('#user-form');
    if (!f && !uf) return;
    e.preventDefault();
    if (f) {
      const v = new FormData(f), box = document.getElementById('auth-error'), btn = f.querySelector('button');
      btn.disabled = true; box.style.display = 'none';
      try {
        if (AUTH.needsBootstrap) await STAI.api.bootstrap(String(v.get('email')), String(v.get('name')), String(v.get('password')));
        else await STAI.api.login(String(v.get('email')), String(v.get('password')));
        location.hash = '#/'; location.reload();
      } catch (err) { box.textContent = err.message; box.style.display = ''; btn.disabled = false; }
    } else {
      const v = new FormData(uf), btn = uf.querySelector('button');
      btn.disabled = true; US.err = null;
      try { await STAI.api.createUser({ email: String(v.get('email')), full_name: String(v.get('name')), role: String(v.get('role')), password: String(v.get('password')) }); uf.reset(); US.list = await STAI.api.listUsers(); }
      catch (err) { US.err = err.message; }
      render(true);
    }
  });
  const whoBox = () => `<div class="who"><small>Signed in as</small><span>${esc(ME.full_name)}</span><small>${esc(ROLE_LABEL[ME.role])}</small>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${can('admin') ? '<a class="navbtn" href="#/users">Users</a>' : ''}${can('audit') ? '<a class="navbtn" href="#/audit">Audit log</a>' : ''}<button class="navbtn" data-act="acctPassword">Password</button><button class="navbtn" data-act="acctSignOut">Sign out</button></div></div>`;
  STAI.onUnauthorized = () => { if (ME) { ME = null; PERMS = []; AUTH.checked = true; render(false); } };

  const DL = { busy: false };
  async function saveFile(path) {
    if (DL.busy) return;
    DL.busy = true;
    try {
      const f = await STAI.api.download(path, path.split('/').pop());
      const a = document.createElement('a'); a.href = URL.createObjectURL(f.blob); a.download = f.name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch (e) { window.alert('Could not create the document: ' + e.message); }
    DL.busy = false;
  }
  const dlBtn = (path, label, cls) => `<button class="${cls || 'btn2'}" data-act="dl" data-arg="${esc(path)}">${label}</button>`;
  const US = { loaded: false, loading: false, error: null, list: [], err: null };
  async function loadUsers() {
    US.loading = true; US.error = null;
    try { US.list = await STAI.api.listUsers(); US.loaded = true; } catch (e) { US.error = e.message; }
    US.loading = false; renderIfIdle('users');
  }
  function users() {
    if (!US.loaded && !US.loading && !US.error) loadUsers();
    const head = hdr('Local accounts for this platform', 'Users');
    if (US.error && !US.loaded) return head + `<div class="note alert" role="alert"><strong>Could not load users</strong><span style="font-size:13px">${esc(US.error)}</span></div>`;
    if (!US.loaded) return head + '<p class="cap">Loading\u2026</p>';
    const roles = Object.keys(ROLE_LABEL);
    return head + `<section class="card" style="padding-top:8px"><h2 class="ph">People</h2>${US.list.map((u) => `<div class="lrow"><span class="stack"><span style="font-weight:500">${esc(u.full_name)}${u.id === ME.id ? ' <span class="cap">(you)</span>' : ''}${u.active ? '' : ' <span class="pill muted">disabled</span>'}</span><span class="cap">${esc(u.email)} \u00b7 ${u.last_login_at ? 'last signed in ' + esc(cwhen(u.last_login_at)) : 'never signed in'}</span></span>
      <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select class="reqsel" data-chg="usRole" data-arg="${esc(u.id)}" aria-label="Role of ${esc(u.full_name)}">${roles.map((r) => opt(r, ROLE_LABEL[r], u.role)).join('')}</select><button class="btn2 btn-s" data-act="usActive" data-arg="${esc(u.id)}">${u.active ? 'Disable' : 'Enable'}</button><button class="btn2 btn-s" data-act="usReset" data-arg="${esc(u.id)}">Reset password</button></span></div>`).join('')}</section>
      <section class="card" style="padding:20px;display:flex;flex-direction:column;gap:12px"><h2>Add a person</h2><span class="cap">${roles.map((r) => ROLE_LABEL[r] + ': ' + ROLE_HELP[r]).join(' \u00b7 ')}. A new password is at least 10 characters; share it through another channel.</span>
      <form id="user-form" class="prow" style="flex-wrap:wrap;gap:8px;align-items:flex-end"><label class="cap">Full name<br><input class="reqsel" name="name" required minlength="2"></label><label class="cap">Email<br><input class="reqsel" type="email" name="email" required></label><label class="cap">Role<br><select class="reqsel" name="role">${roles.map((r) => opt(r, ROLE_LABEL[r], 'engineer')).join('')}</select></label><label class="cap">Initial password<br><input class="reqsel" type="password" name="password" required minlength="10" autocomplete="new-password"></label><button class="btn" type="submit">Add</button></form>
      ${US.err ? `<div class="note alert" role="alert"><span style="font-size:13px;white-space:pre-wrap">${esc(US.err)}</span></div>` : ''}</section>`;
  }
  const AU = { loaded: false, loading: false, error: null, events: [], verify: null, more: true };
  async function loadAudit(older) {
    AU.loading = true; AU.error = null;
    try { const rows = await STAI.api.listAudit(older && AU.events.length ? AU.events[AU.events.length - 1].seq : null); AU.events = older ? AU.events.concat(rows) : rows; AU.more = rows.length === 100; AU.loaded = true; } catch (e) { AU.error = e.message; }
    AU.loading = false; renderIfIdle('audit');
  }
  function audit() {
    if (!AU.loaded && !AU.loading && !AU.error) loadAudit(false);
    const head = hdr('Every change, sign-in and refused action, chained by hash', 'Audit log');
    if (AU.error && !AU.loaded) return head + `<div class="note alert" role="alert"><strong>Could not load the audit log</strong><span style="font-size:13px">${esc(AU.error)}</span></div>`;
    if (!AU.loaded) return head + '<p class="cap">Loading\u2026</p>';
    const v = AU.verify, tone = { ok: 'ok', denied: 'warn', failed: 'bad' };
    return head + `<section class="card" style="padding:16px 20px;display:flex;flex-direction:column;gap:10px"><span class="cap" style="max-width:820px">Each event\u2019s hash covers the one before it, so an event that is edited or removed from the middle is detected. The log holds who did what and when, never the content of a request. Removing the newest events cannot be detected from inside the log; keep a copy of the head hash somewhere else if that matters.</span>
      <div class="prow"><button class="btn2" data-act="auVerify">Verify the chain</button>${dlBtn('/api/export/audit.pdf', 'Export PDF')}${dlBtn('/api/export/audit.csv', 'Export CSV')}${dlBtn('/api/export/audit.json', 'Export JSON')}${v ? `<span class="pill ${v.ok ? 'ok' : 'bad'}">${v.ok ? 'Intact \u00b7 ' + v.events + ' events' : 'BROKEN at event ' + v.broken_at}</span>` : ''}</div>
      ${v && !v.ok ? `<div class="note alert"><span style="font-size:13px">${esc(v.problem)}</span></div>` : ''}${v && v.head_hash ? `<span class="cap mono">head sha256:${esc(v.head_hash)}</span>` : ''}</section>

  const RCRR = { key: null, want: null, timer: null, result: null, error: null, profiles: [] };

    } else {

    <div class="studiocols"><section class="card" style="overflow:auto;padding:16px;min-height:420px"><div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap"><span style="font-size:13px;font-weight:600">Agent architecture view</span><span class="cap">Secure Tropos with agent elements · click to edit</span></div>

  /* ---------- Drift review ---------- */
  /* ---------- Drift review and findings (Task 7c): rows come from the database ---------- */
  const FD = { loaded: false, loading: false, error: null, drift: [], findings: [], driftScen: [], findScen: [], sim: { agent: '', scenario: '' }, fsim: { agent: '', scenario: '' }, busy: false, msg: null, fmsg: null, err: null, ferr: null };
  async function loadFD() {

  /* ---------- Contract ---------- */
  const FIELDS = [['tools', 'Allowed tools', 'stripe.invoices.read, stripe.invoices.create, crm.accounts.read', 'MCP manifests and telemetry'], ['data', 'Data scopes', 'billing_records: read/write · customer_pii: masked', 'IdP scopes'], ['egress', 'Egress', 'email to @acmepayments.example only', 'observed telemetry'], ['deleg', 'Delegation', 'may call notify-agent; no other agents', 'LangGraph config'], ['approval', 'Human approval', 'invoices over £5,000 need a finance approver', 'AI policy template'], ['kill', 'Kill switch', 'halt by owner or compliance · drill every 30 days', 'policy template']];

  /* ---------- Packs (Task 7e): generated from real data, stored as hashed, chained ---------- */

    const history = PK.list.length > 1 || (PK.list.length === 1 && PK.sel) ? `<section class="card" style="padding-top:8px"><h2 class="ph">Generated packs</h2>${PK.list.map((x) => `<div class="lrow"><span class="stack"><span style="font-weight:500">${esc(x.pack_key)} \u00b7 ${x.template === 'TRUST' ? 'Trust report' : 'Assurance Pack'}</span><span class="cap">${esc(x.period_label)} \u00b7 ${esc(cwhen(x.generated_at))} \u00b7 ${x.claims} claims, ${x.gaps} gaps</span></span>${x.pack_key === key ? '<span class="cap">viewing</span>' : `<button class="btn2 btn-s" data-act="pkSel" data-arg="${esc(x.pack_key)}">View</button>`}</div>`).join('')}</section>` : '';

    <span class="cap">Contracts in force are always included. Gaps, simulated findings and the limits of the evidence are stated in every pack.</span>

      ${x.agents.some((a) => a.requirements) ? sec('Design-time regulatory requirements', x.agents.filter((a) => a.requirements).map((a) => `<div class="stack" style="gap:4px"><span style="font-weight:600">${esc(a.agent)}</span>${a.requirements.map((r) => row(esc(r.name), `${esc(r.instrument)} \u00b7 ${esc(r.class)}${r.signed_off_by ? ' \u00b7 signed off by ' + esc(r.signed_off_by) : ''}`, `<span class="pill ${pill[r.counted] || 'muted'}">${esc(r.counted)}</span>`)).join('')}</div>`).join('')) : ''}

  /* ----- registry construction (port of useCanvasStore.runScore / buildGovernanceRegistry) ----- */
  function buildRegistry() {

    const departments = nodes.filter((n) => n.kind === 'DEPARTMENT').map((n) => ({ id: n.id, name: n.data.name || n.id, reports_to_department_id: n.data.reportsToDepartmentId || undefined }));

    const terms = [['L', t.L], ['I', t.I], ['\u0394', t.delta], ['\u03c4', t.tau], ['D<sub>m</sub>', t.Dm], ['W<sub>r</sub>', t.Wr], ['W<sub>s</sub>', t.Ws], ['W<sub>f</sub>', t.Wf], ['W<sub>h</sub>', t.Wh], ['RCF', t.rcf_adj], ['\u03b5<sub>b</sub>', t.eps_b], ['\u03b5<sub>ia</sub>', t.eps_ia]];

      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span class="rcr-score">${STAI.pyFixed(p.pcs_final, 1)}</span><span class="stack" style="gap:6px"><span class="pill ${TIER_CLS[p.tier]}" style="align-self:flex-start">${p.tier} tier</span><span class="pill ${GATE_CLS[p.gate]}" style="align-self:flex-start">Gate ${p.gate.replace('_', ' ')}</span></span></div>

      <span class="cap mono" style="font-size:12px;line-height:1.6">PCS = (L\u00b7I\u00b7\u0394/\u03c4) \u00b7 D<sub>m</sub> \u00b7 (W<sub>r</sub>W<sub>s</sub>W<sub>f</sub>W<sub>h</sub>) \u00b7 RCF \u00b7 (1 + \u03b5<sub>b</sub> + \u03b5<sub>ia</sub>), \u00d74, capped at 100, with a veto-weighted floor</span>
      <div class="m-terms">${terms.map(([k, v]) => `<span><small>${k}</small><b class="mono">${fmt(v)}</b></span>`).join('')}</div>
      <div class="stack" style="gap:8px"><strong style="font-size:13px">Risk pillars</strong>${pillars.map(([k, v]) => `<div class="m-pillar"><span>${k}</span><div class="meter"><span style="width:${Math.min(100, v)}%;background:${v >= 60 ? '#B42318' : v >= 30 ? '#D97706' : '#1E7F4F'}"></span></div><b class="mono">${STAI.pyFixed(v, 1)}</b></div>`).join('')}<span class="cap">Composite (balanced profile) ${STAI.pyFixed(t.risk_vector.composite, 1)}${t.risk_vector.gate_blocked ? ` \u00b7 ${t.risk_vector.blocking_dimension} at or above 80` : ''}</span></div>
      ${list('Blockers', t.blockers, 'alert')}${list('Warnings', t.warnings, 'plain')}${list('Recommendations', t.recommendations, 'good')}

  const CHAT_SAMPLES = [
    'A data scientist in the clinical AI team trains an LLM that triages patient messages; the clinical safety officer signs it off, platform ops deploys it, and triage nurses act on its output. We need a DPIA and human oversight.',
    'Our analytics team builds a credit-scoring model. The risk committee validates it, the platform team puts it into production, and loan officers use its decisions. Applicants need the right to an explanation.',

  async function sendChat(text) {
    if (M.chatBusy) return;
    const history = M.chatLog.filter((m) => !m.error).map((m) => ({ role: m.who === 'user' ? 'user' : 'assistant', content: m.text }));
    M.chatLog.push({ who: 'user', text }); M.chatBusy = true;
    try {
      const g = await STAI.api.chat(text, history);
      M.chatLog.push({ who: 'bot', text: g.reply || 'Done.' });
      applyGenerated(g); fitZoom();
    } catch (e) { M.chatLog.push({ who: 'bot', text: e.message, error: true }); }
    M.chatBusy = false; render(true);
  }
  function applyGenerated(g) {
    const map = {}, baseX = M.nodes.reduce((m, n) => Math.max(m, n.x + size(n).w), 0) + (M.nodes.length ? 80 : 40);
    (g.departments || []).forEach((d, i) => { const n = addNode('DEPARTMENT', { name: d.name }, { x: baseX + i * 290, y: 40 }); map[d.temp_id] = n; });
    (g.departments || []).forEach((d) => { if (d.reports_to_temp_id && map[d.reports_to_temp_id]) { map[d.temp_id].data.reportsToDepartmentId = map[d.reports_to_temp_id].id; addEdge(map[d.temp_id].id, map[d.reports_to_temp_id].id); } });
    const slots = {};
    let free = 0;
    (g.actors || []).forEach((a) => {
      const dept = a.department_temp_id && map[a.department_temp_id];
      let pos;
      if (dept) { const k = slots[dept.id] = (slots[dept.id] || 0) + 1; pos = { x: dept.x + 35, y: dept.y + 40 + (k - 1) * 70 }; if (k > 2) { dept.h = Math.max(dept.h, 50 + k * 70); } }
      else { pos = { x: baseX + (free % 2) * 220, y: 280 + Math.floor(free / 2) * 90 }; free++; }
      const n = addNode('ACTOR', { subtype: a.subtype, identity: a.identity || '' }, pos);
      if (dept) { n.parent = dept.id; n.data.departmentId = dept.id; }
      map[a.temp_id] = n;
    });
    const rowY = 280 + Math.ceil(free / 2) * 90 + (free ? 20 : 0);
    (g.ai_models || []).forEach((m, i) => { map[m.temp_id] = addNode('AI_MODEL', { name: m.name, modelType: m.model_type, aiCriticality: m.ai_criticality, domain: m.domain || '', dataSensitivity: m.data_sensitivity, hostingEnvironment: m.hosting_environment }, { x: baseX + 460, y: rowY + i * 90 }); });
    (g.deployment_environments || []).forEach((e, i) => { map[e.temp_id] = addNode('DEPLOYMENT_ENV', { name: e.name, description: e.description || '' }, { x: baseX + 700, y: rowY + i * 90 }); });
    (g.constraints || []).forEach((c, i) => { map[c.temp_id] = addNode('CONSTRAINT', { constraintId: c.constraint_id, status: 'NOT_YET_DETERMINED', evidence: '' }, { x: baseX + (i % 3) * 220, y: rowY + 120 + Math.floor(i / 3) * 90 }); });
    (g.edges || []).forEach((e) => { if (map[e.from_temp_id] && map[e.to_temp_id]) addEdge(map[e.from_temp_id].id, map[e.to_temp_id].id); });
    persist();
  }

      const cur = window.prompt('Your current password'); if (!cur) return;
      const nw = window.prompt('A new password (at least 10 characters)'); if (!nw) return;
      try { await STAI.api.changePassword(cur, nw); window.alert('Password changed. Your other sign-ins were ended.'); } catch (e) { window.alert('Could not change the password: ' + e.message); }
    },
    usActive: async (id) => { const u = US.list.find((x) => x.id === id); if (!u) return; try { await STAI.api.updateUser(id, { active: !u.active }); US.list = await STAI.api.listUsers(); US.err = null; } catch (e) { US.err = e.message; } },
    usReset: async (id) => { const pw = window.prompt('A new password for this person (at least 10 characters). Their sign-ins end.'); if (!pw) return; try { await STAI.api.resetPassword(id, pw); US.err = null; window.alert('Password reset.'); } catch (e) { US.err = e.message; } },
    auVerify: async () => { try { AU.verify = await STAI.api.verifyAudit(); } catch (e) { AU.error = e.message; } },
    auMore: () => { loadAudit(true); }
  });
  Object.assign(C, { usRole: async (v, id) => { try { await STAI.api.updateUser(id, { role: v }); US.list = await STAI.api.listUsers(); US.err = null; } catch (e) { US.err = e.message; US.list = await STAI.api.listUsers().catch(() => US.list); } } });


  Object.assign(H, {
    sSign: (key) => { const row = ((RCRR.result && RCRR.result.rows) || []).find((x) => x.key === key) || {}; const cur = (S.studio.req || {})[key] || { status: row.declared, evidence: row.evidence }; S.studio.req = Object.assign({}, S.studio.req, { [key]: Object.assign({}, cur, { signed_off_by: ME.full_name }) }); S.studio.ratified = false; },
    sUnsign: (key) => { const row = ((RCRR.result && RCRR.result.rows) || []).find((x) => x.key === key) || {}; const cur = (S.studio.req || {})[key] || { status: row.declared, evidence: row.evidence }; S.studio.req = Object.assign({}, S.studio.req, { [key]: Object.assign({}, cur, { signed_off_by: '' }) }); S.studio.ratified = false; }
  });

  Object.assign(H, {
    dl: (path) => { saveFile(path); },
    pkDownload: (key) => { saveFile('/api/export/packs/' + key + '.json'); },
    acDownload: (id) => { saveFile('/api/export/contracts/' + id + '.json'); },
    mDownload: (id) => { saveFile('/api/export/contracts/' + id + '.json'); }
  });


  function route() {
    const r = location.hash.replace(/^#\/?/, '').split('?')[0];
    if (r === '') return 'home';
    if (r === 'model') return 'model';
    if (r === 'model/contracts') return 'modelcontracts';
    if (r === 'policies') return 'policies';
    if (r === 'regulations') return 'regulations';
    return SCREENS[r] ? r : 'overview';
  }
  function render(keepScroll) {
    if (!ME) { document.getElementById('app').innerHTML = authScreen(); document.title = 'ASTRA \u00b7 Sign in'; return; }
    const r = route(), y = window.scrollY;
    const keep = {};
    ['#m-canvas', '.m-side', '.m-palette', '.m-chatlog'].forEach((q) => { const el = document.querySelector(q); if (el) keep[q] = [el.scrollLeft, el.scrollTop]; });
    let html;
    if (r === 'home') html = home();
    else if (r === 'model') html = `<div class="shell">${modelNav('model')}<main id="main" class="wide">${modelStudio()}</main></div>`;
    else if (r === 'modelcontracts') html = `<div class="shell">${modelNav('contracts')}<main id="main">${modelContracts()}</main></div>`;
    else if (r === 'policies') html = `<div class="shell">${policiesFrom() === 'model' ? modelNav('policies') : nav('policies')}<main id="main">${policiesScreen()}</main></div>`;
    else if (r === 'regulations') html = `<div class="shell">${policiesFrom() === 'model' ? modelNav('regulations') : nav('regulations')}<main id="main">${regulationsScreen()}</main></div>`;
    else html = `<div class="shell">${nav(PARENT[r] || r)}<main id="main">${SCREENS[r]()}</main></div>`;
    document.getElementById('app').innerHTML = html;
    const mainEl = document.getElementById('main');
    if (mainEl && ME.role === 'auditor') mainEl.insertAdjacentHTML('afterbegin', '<div class="note plain" role="status"><strong>Read-only</strong><span style="font-size:13px">Your role is auditor: you can view everything and the audit log, but not change anything.</span></div>');
    if (keepScroll) Object.keys(keep).forEach((q) => { const el = document.querySelector(q); if (el) { el.scrollLeft = keep[q][0]; el.scrollTop = keep[q][1]; } });
    window.scrollTo(0, keepScroll ? y : 0);
    const titles = { home: 'ASTRA \u00b7 Choose a module', model: 'ASTRA \u00b7 Model studio', modelcontracts: 'ASTRA \u00b7 Compiled contracts', policies: 'ASTRA \u00b7 Policies', regulations: 'ASTRA \u00b7 Regulations', users: 'ASTRA \u00b7 Users', audit: 'ASTRA \u00b7 Audit log' };
    document.title = titles[r] || 'ASTRA \u00b7 Agent assurance prototype';
    agentAutosaveCheck();
  }
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = H[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el.dataset.arg); render(true); }
  });
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-chg]');
    if (!el) return;
    const fn = C[el.dataset.chg];
    if (fn) {
      fn(el.type === 'checkbox' ? el.checked : el.value, el.dataset.arg, el);
      // In the model studio a change often fires on blur, mid-click; re-render on the next tick so the click lands first.
      // A text field commits when it loses focus, often because a button is being pressed: re-render a moment later so that click still lands.
      if (route() === 'model') setTimeout(() => render(true), 0); else if (el.matches('input:not([type=checkbox]), textarea')) setTimeout(() => render(true), 250); else render(true);
    }
  });
  window.addEventListener('hashchange', () => render(false));
  async function startApp() {
    render(false);
    try { AUTH.needsBootstrap = (await STAI.api.authStatus()).needs_bootstrap; } catch (e) { /* the sign-in form still shows */ }
    try { const m = await STAI.api.authMe(); ME = m.user; PERMS = m.permissions; } catch (e) { ME = null; }
    AUTH.checked = true;
    if (!ME) { render(false); return; }
    render(false);
    boot();
    loadOrganisation();
    loadRcrProfiles();
    loadFD();
    loadCV();
    loadAgents().then(() => { const k = lsGet(AG_LS); if (k && AG.designs.some((d) => d.design_key === k) && !S.studio.drafted) openAgentDesign(k).then(() => renderIfIdle(route())).catch(() => {}); });
  }
  startApp();
})();
</script>
</body>
